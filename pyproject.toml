[project]
name = "heathrow-surface-access"
version = "0.1.0"
description = "Heathrow surface-access coursework dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "plotly==5.22.0",
    "pydantic>=2.12,<3",
    "streamlit==1.35.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2,<2.3",
    "pyright>=1.1.400,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
# Streamlit's transitive dependency: retain the security floor.
constraint-dependencies = ["gitpython>=3.1.62,<4"]

[tool.ruff]
extend-exclude = ["dist"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["Home.py", "heathrow", "pages"]
exclude = [".venv", "data", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
